name: SEO (reusable)

on:
  workflow_call:
    inputs:
      # Human review gate: when true the gate never auto-merges — every PR
      # stays open and is reported as needs_review. For repos where the
      # generated prose itself is the risk (invented product claims shipped
      # three times before guard tests caught them downstream), CI cannot
      # judge content, only a human can.
      require_review:
        type: boolean
        required: false
        default: false
      # run: the full pipeline (default). watch: the daily guard without an LLM
      # (index status and traffic, alerts only), no secrets besides Google's.
      mode:
        type: string
        required: false
        default: run
      # 1Password vault holding the shared `seo-cli` item. `development` keeps
      # the old behaviour (only ANTHROPIC_API_KEY and SERPAPI_KEY come from
      # 1Password, everything else from repo secrets). Any other vault (e.g.
      # `Bots`) also supplies GSC_CREDENTIALS, GSC_TOKEN, SEO_NOTIFY_WEBHOOK and
      # CLAUDE_CODE_OAUTH_TOKEN from op://<op_vault>/seo-cli/<FIELD>. A repo
      # secret of the same name wins over the 1Password value.
      op_vault:
        type: string
        required: false
        default: development
    secrets:
      # Option A: 1Password (ANTHROPIC_API_KEY + SERPAPI_KEY werden aus 1Password geladen)
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
      # Option B: Direkte Secrets (wenn kein 1Password vorhanden)
      ANTHROPIC_API_KEY:
        required: false
      SERPAPI_KEY:
        required: false
      # Optional: run LLM calls on the Claude subscription (`claude setup-token`). Without it every call uses ANTHROPIC_API_KEY.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      # Repo secrets, or from 1Password via op_vault. The Google step fails with a
      # clear message when neither source delivers them.
      GSC_CREDENTIALS:
        required: false
      GSC_TOKEN:
        required: false
      # Optional: n8n-Webhook-URL fuer E-Mail-Benachrichtigung (merged / needs review)
      SEO_NOTIFY_WEBHOOK:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Two runs of one project must not interleave: both write state to main and
    # open PRs from it. A second run waits for the first instead of cancelling it.
    concurrency:
      group: seo-${{ github.repository }}
      cancel-in-progress: false
    # Batched generation waits up to 45 minutes per call.
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      # Required so the gate can `gh workflow run deploy.yml` after auto-merge.
      # A GITHUB_TOKEN merge does not trigger push workflows, so the deploy must
      # be dispatched explicitly, which needs actions:write. The caller job must
      # grant it too (caller permissions cap the reusable workflow's token).
      actions: write
      # Required so the gate can `gh pr view --json statusCheckRollup` to wait
      # for the target repo's PR checks (e.g. Pest CI) before merging.
      checks: read
      statuses: read
    env:
      HAVE_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
      SHARED_VAULT: ${{ inputs.op_vault != 'development' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Empty values are not references and are ignored by the action. Watch mode
      # needs no LLM or SerpAPI key, so it loads only the Google pair, and only
      # from a non-default vault (the default vault has no such fields).
      - name: Load shared secrets from 1Password
        if: env.HAVE_OP_TOKEN == 'true' && (inputs.mode != 'watch' || env.SHARED_VAULT == 'true')
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ inputs.mode != 'watch' && format('op://{0}/seo-cli/ANTHROPIC_API_KEY', inputs.op_vault) || '' }}
          SERPAPI_KEY: ${{ inputs.mode != 'watch' && format('op://{0}/seo-cli/SERPAPI_KEY', inputs.op_vault) || '' }}
          GSC_CREDENTIALS: ${{ env.SHARED_VAULT == 'true' && format('op://{0}/seo-cli/GSC_CREDENTIALS', inputs.op_vault) || '' }}
          GSC_TOKEN: ${{ env.SHARED_VAULT == 'true' && format('op://{0}/seo-cli/GSC_TOKEN', inputs.op_vault) || '' }}

      # Separate and non-fatal: a field that is not in the item yet (the Claude
      # token is added later) must not stop the run. Without it the run uses the
      # API key, without the webhook it reports nowhere (visible warning).
      - name: Load optional secrets from 1Password
        if: env.HAVE_OP_TOKEN == 'true' && env.SHARED_VAULT == 'true'
        continue-on-error: true
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SEO_NOTIFY_WEBHOOK: ${{ format('op://{0}/seo-cli/SEO_NOTIFY_WEBHOOK', inputs.op_vault) }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.mode != 'watch' && format('op://{0}/seo-cli/CLAUDE_CODE_OAUTH_TOKEN', inputs.op_vault) || '' }}

      - name: Use direct secrets (no 1Password)
        if: inputs.mode != 'watch' && env.HAVE_OP_TOKEN != 'true'
        env:
          DIRECT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIRECT_SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          {
            echo "ANTHROPIC_API_KEY<<SECRET_EOF"
            printf '%s\n' "$DIRECT_ANTHROPIC_API_KEY"
            echo "SECRET_EOF"
            echo "SERPAPI_KEY<<SECRET_EOF"
            printf '%s\n' "$DIRECT_SERPAPI_KEY"
            echo "SECRET_EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout seo-cli
        uses: actions/checkout@v7
        with:
          repository: raaaf/seo-cli
          path: .seo-cli

      - name: Install seo-cli dependencies
        run: npm ci
        working-directory: .seo-cli

      # Only with a token (repo secret or 1Password): without it seo-cli never starts `claude`.
      - name: Install Claude Code
        if: inputs.mode != 'watch'
        env:
          SECRET_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${SECRET_CLAUDE_CODE_OAUTH_TOKEN:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "No Claude Code token, skipping the install."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code@2.1.292

      # A repo secret wins over the 1Password value (exported as GSC_CREDENTIALS / GSC_TOKEN).
      - name: Write Google credentials
        env:
          SECRET_GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          SECRET_GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
        run: |
          CREDENTIALS="${SECRET_GSC_CREDENTIALS:-${GSC_CREDENTIALS:-}}"
          TOKEN="${SECRET_GSC_TOKEN:-${GSC_TOKEN:-}}"
          if [ -z "$CREDENTIALS" ] || [ -z "$TOKEN" ]; then
            echo "::error::GSC_CREDENTIALS and GSC_TOKEN are missing. Set them as repo secrets, or pass OP_SERVICE_ACCOUNT_TOKEN and an op_vault whose seo-cli item has both fields."
            exit 1
          fi
          umask 077
          printf '%s' "$CREDENTIALS" > /tmp/gsc-credentials.json
          printf '%s' "$TOKEN" > "$HOME/.seo-cli-token.json"

      - name: Run seo
        if: inputs.mode != 'watch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsc-credentials.json
          # ANTHROPIC_API_KEY (from GITHUB_ENV) stays set: it is the fallback.
          SECRET_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # A repo secret wins; otherwise CLAUDE_CODE_OAUTH_TOKEN may already be set from 1Password.
        run: |
          if [ -n "${SECRET_CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$SECRET_CLAUDE_CODE_OAUTH_TOKEN"; fi
          node .seo-cli/bin/seo.js run --report "$RUNNER_TEMP/seo-report.json"

      # Index status and traffic through `seo watch`: alerts only for what is new
      # or resolved, state committed to main only when it changed. In run mode it
      # follows the run, non-fatal (the zeit incident, deindexed 2026-08-04 and
      # unnoticed for five weeks, is why it exists, but a Search Console hiccup
      # must not fail the run). In watch mode it is the job and its report feeds
      # the notify step. Needs no LLM or SerpAPI key.
      - name: Watch (index status and traffic)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsc-credentials.json
          MODE: ${{ inputs.mode }}
        run: |
          WATCH_REPORT="$RUNNER_TEMP/seo-watch.json"
          if [ "$MODE" = "watch" ]; then WATCH_REPORT="$RUNNER_TEMP/seo-report.json"; fi
          if ! node .seo-cli/bin/seo.js watch --commit --report "$WATCH_REPORT"; then
            if [ "$MODE" = "watch" ]; then exit 1; fi
            echo "::warning::seo watch failed (non-fatal)"
            echo "seo watch failed" >> "$RUNNER_TEMP/seo-warnings.txt"
          fi

      # One pass per PR from the run report. The state files are already on main
      # (committed by `seo run`), so the PR branches contain pages only.
      - name: Gate (validate, auto-merge)
        if: always() && inputs.mode != 'watch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_REVIEW: ${{ inputs.require_review }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsc-credentials.json
        run: |
          set -uo pipefail

          REPORT_FILE="$RUNNER_TEMP/seo-report.json"
          GATE_STATUS_FILE="$RUNNER_TEMP/gate-status.txt"
          : > "$GATE_STATUS_FILE"

          # Gates one PR. Ends with `return`, never `exit`, so the next PR still
          # runs, always goes back to main, and appends "<url> <status>" to the
          # status file that the notify step reads.
          gate_pr() {
            local PR_URL="$1"
            local PR_NUM="${PR_URL##*/}"
            local STATUS CHECKS_STATUS CHECK_EXIT

            if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
              echo "Refusing to gate: PR number is not numeric ('$PR_NUM')."
              echo "$PR_URL invalid_url" >> "$GATE_STATUS_FILE"
              return 1
            fi
            echo "Gating PR #$PR_NUM ($PR_URL)"

            # Changed markdown files in the PR
            local MD
            mapfile -t MD < <(gh pr view "$PR_NUM" --json files -q '.files[].path' | grep -E '\.md$' || true)
            if [ ${#MD[@]} -eq 0 ]; then
              echo "PR has no markdown pages: skipping gate."
              echo "$PR_URL no_pages" >> "$GATE_STATUS_FILE"
              return 0
            fi

            # `seo run` leaves tracked state files modified in the working tree
            # and may leave new untracked ones (seo/budget.json on a first run).
            # Both are already committed on main and so on the PR branch, so
            # discard the local copies; otherwise the checkout below aborts with
            # "local changes would be overwritten". (.seo-cli is untracked, lives
            # outside seo/ and is preserved.)
            git checkout -- . 2>/dev/null || true
            git clean -fdq -- seo 2>/dev/null || true

            # Check out the PR branch so its pages are present
            if ! gh pr checkout "$PR_NUM"; then
              echo "$PR_URL checkout_failed" >> "$GATE_STATUS_FILE"
              git checkout main 2>/dev/null || true
              return 1
            fi

            node .seo-cli/bin/seo.js check "${MD[@]}" | tee /tmp/seo-check.out
            CHECK_EXIT=${PIPESTATUS[0]}

            # Human review gate: skip the CI wait and the merge entirely. The
            # notify path still runs so the needs_review mail goes out.
            if [ "${REQUIRE_REVIEW}" = "true" ]; then
              echo "require_review is set, leaving PR #$PR_NUM open for human review."
            fi

            # Wait for the target repo's PR checks (e.g. Pest CI) before merging.
            # No branch protection is available on private/free-plan repos, so the
            # gate itself must not merge ahead of a slow test run.
            CHECKS_STATUS=""
            if [ "$CHECK_EXIT" -eq 0 ] && [ "${REQUIRE_REVIEW}" != "true" ]; then
              POLL_INTERVAL=30
              MAX_WAIT=1500
              ELAPSED=0

              # An empty check rollup is ambiguous: the repo may have no PR CI at
              # all, or its checks may simply not have registered yet. Waiting a
              # fixed grace period guessed at the answer and guessed wrong: a
              # page merged ungated in 2026-W31 and broke the target repo's test
              # suite. Ask the repo instead: does any active workflow trigger on
              # pull_request? If one does, an empty rollup means "not yet" and we
              # keep waiting; if none does, there is nothing to wait for.
              EXPECTS_CHECKS=unknown
              if WF_PATHS=$(gh api "repos/${{ github.repository }}/actions/workflows" \
                              --jq '.workflows[] | select(.state == "active") | .path' 2>/dev/null); then
                EXPECTS_CHECKS=no
                while read -r wf; do
                  [ -z "$wf" ] && continue
                  if gh api "repos/${{ github.repository }}/contents/${wf}?ref=${{ github.ref_name }}" \
                       --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
                       | grep -qE '^[[:space:]]*(on:.*pull_request|pull_request:|-[[:space:]]*pull_request)'; then
                    EXPECTS_CHECKS=yes
                    break
                  fi
                done <<< "$WF_PATHS"
              fi
              echo "Repo runs workflows on pull_request: $EXPECTS_CHECKS"

              # The listing call failing is not a licence to merge blind: fall
              # back to the old behaviour of waiting a short grace period.
              GRACE_PERIOD=90
              [ "$EXPECTS_CHECKS" = "yes" ] && GRACE_PERIOD="$MAX_WAIT"

              while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
                # Normalize both statusCheckRollup shapes (CheckRun: status/conclusion,
                # StatusContext: state) into a flat list of terminal/pending states.
                STATES_JSON=$(gh pr view "$PR_NUM" --json statusCheckRollup --jq '
                  [.statusCheckRollup[] |
                    if .__typename == "StatusContext" then .state
                    else (if .status == "COMPLETED" then (.conclusion // "PENDING") else "PENDING" end)
                    end
                  ]
                ' 2>/dev/null || echo "[]")
                [ -z "$STATES_JSON" ] && STATES_JSON="[]"

                NUM_CHECKS=$(echo "$STATES_JSON" | jq 'length')

                if [ "$NUM_CHECKS" -eq 0 ]; then
                  if [ "$ELAPSED" -lt "$GRACE_PERIOD" ]; then
                    echo "No PR checks registered yet (${ELAPSED}s elapsed), waiting out grace period..."
                    sleep "$POLL_INTERVAL"
                    ELAPSED=$((ELAPSED + POLL_INTERVAL))
                    continue
                  fi
                  echo "No PR checks after ${GRACE_PERIOD}s and no pull_request workflow to wait for, proceeding without CI gating."
                  CHECKS_STATUS=none
                  break
                fi

                FAILED=$(echo "$STATES_JSON" | jq '[.[] | select(. as $s | ["FAILURE","ERROR","CANCELLED","TIMED_OUT","ACTION_REQUIRED"] | index($s))] | length')
                if [ "$FAILED" -gt 0 ]; then
                  echo "One or more PR checks failed."
                  CHECKS_STATUS=failed
                  break
                fi

                PENDING=$(echo "$STATES_JSON" | jq '[.[] | select(. == "PENDING")] | length')
                if [ "$PENDING" -eq 0 ]; then
                  echo "All PR checks completed successfully."
                  CHECKS_STATUS=success
                  break
                fi

                echo "PR checks still pending (${ELAPSED}s elapsed), waiting ${POLL_INTERVAL}s..."
                sleep "$POLL_INTERVAL"
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
              done

              if [ -z "$CHECKS_STATUS" ]; then
                echo "Timed out after ${MAX_WAIT}s waiting for PR checks."
                CHECKS_STATUS=timeout
              fi
            fi

            if [ "${REQUIRE_REVIEW}" = "true" ]; then
              STATUS=needs_review
            elif [ "$CHECK_EXIT" -eq 0 ]; then
              if [ "$CHECKS_STATUS" = "failed" ] || [ "$CHECKS_STATUS" = "timeout" ]; then
                if [ "$CHECKS_STATUS" = "failed" ]; then
                  STATUS=checks_failed
                else
                  STATUS=checks_timeout
                fi
                echo "Not merging PR #$PR_NUM: PR checks did not pass ($STATUS)."
              elif gh pr merge "$PR_NUM" --squash --delete-branch; then
                STATUS=merged
                # A merge by GITHUB_TOKEN does not trigger other workflows (incl. deploy).
                # Dispatch the deploy explicitly so the merged pages go live.
                if gh workflow run deploy.yml --ref main; then
                  echo "Deploy workflow dispatched."
                else
                  echo "Deploy dispatch skipped (no deploy.yml or no workflow_dispatch trigger)."
                fi
                # (Re)submit the sitemap so Google re-crawls the new pages. Non-fatal.
                node .seo-cli/bin/seo.js submit-sitemap || echo "Sitemap submit skipped/failed (non-fatal)."
                # Same for Bing, Yandex and friends via IndexNow. Non-fatal, and a no-op without indexnow_key.
                node .seo-cli/bin/seo.js indexnow || echo "IndexNow submit skipped/failed (non-fatal)."
              else
                STATUS=merge_failed
              fi
            else
              STATUS=needs_review
            fi
            echo "Gate result: $STATUS"

            echo "$PR_URL $STATUS" >> "$GATE_STATUS_FILE"
            git checkout main 2>/dev/null || true
          }

          PR_URLS=()
          if [ -f "$REPORT_FILE" ]; then
            mapfile -t PR_URLS < <(jq -r '.prs[].url' "$REPORT_FILE")
          fi
          if [ ${#PR_URLS[@]} -eq 0 ]; then
            echo "No PR this run, nothing to gate."
            exit 0
          fi

          GATE_FAILED=0
          for url in "${PR_URLS[@]}"; do
            gate_pr "$url" || GATE_FAILED=1
          done
          [ "$GATE_FAILED" -eq 0 ]

      # Last step, runs even when an earlier one failed: every run reports, also
      # when nothing happened. The webhook stays optional (not every caller
      # passes it), a missing one is a visible warning instead of a failure.
      - name: Notify
        if: always()
        env:
          SECRET_NOTIFY_WEBHOOK: ${{ secrets.SEO_NOTIFY_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail

          # A repo secret wins over the 1Password value (exported as SEO_NOTIFY_WEBHOOK).
          NOTIFY_WEBHOOK="${SECRET_NOTIFY_WEBHOOK:-${SEO_NOTIFY_WEBHOOK:-}}"

          REPORT_FILE="$RUNNER_TEMP/seo-report.json"
          GATE_STATUS_FILE="$RUNNER_TEMP/gate-status.txt"
          WARNINGS_FILE="$RUNNER_TEMP/seo-warnings.txt"
          # Run mode: the watch report is a separate file. Watch mode: it is the report.
          WATCH_FILE="$RUNNER_TEMP/seo-watch.json"
          if [ "$MODE" = "watch" ]; then WATCH_FILE="$REPORT_FILE"; fi

          if [ -z "${NOTIFY_WEBHOOK:-}" ]; then
            echo "::warning::No SEO_NOTIFY_WEBHOOK configured, this run reports nowhere."
            exit 0
          fi

          REPORT='{}'
          [ -f "$REPORT_FILE" ] && REPORT=$(cat "$REPORT_FILE")
          GATES='{}'
          [ -s "$GATE_STATUS_FILE" ] && GATES=$(jq -Rn '[inputs | split(" ") | {key: .[0], value: .[1]}] | from_entries' < "$GATE_STATUS_FILE")
          ALERTS='null'
          [ -f "$WATCH_FILE" ] && ALERTS=$(jq -c '.alerts // null' "$WATCH_FILE")
          EXTRA_WARNINGS='[]'
          [ -s "$WARNINGS_FILE" ] && EXTRA_WARNINGS=$(jq -Rn '[inputs]' < "$WARNINGS_FILE")

          # A failed step wins over whatever the report says; no report means the run never got that far.
          if [ "$JOB_STATUS" != "success" ] || [ ! -f "$REPORT_FILE" ]; then
            STATUS=failed
          else
            STATUS=$(jq -r '.status // "failed"' <<< "$REPORT")
          fi

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg status "$STATUS" \
            --arg mode "$MODE" \
            --argjson alerts "$ALERTS" \
            --argjson report "$REPORT" \
            --argjson gates "$GATES" \
            --argjson extra "$EXTRA_WARNINGS" \
            '{repo:$repo, run_url:$run_url, status:$status, mode:$mode, alerts:$alerts,
              prs: ($report.prs // [] | map({url, gate_status: ($gates[.url] // "unknown")})),
              budget: ($report.budget // null),
              llm: ($report.llm // null),
              assessments: ($report.assessments // []),
              warnings: (($report.warnings // []) + $extra),
              errors: ($report.errors // [])}' \
            | curl -sS --fail -X POST -H 'Content-Type: application/json' -d @- "$NOTIFY_WEBHOOK" \
            || echo "::warning::Notify webhook call failed (non-fatal)."

      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/gsc-credentials.json
          rm -f "$HOME/.seo-cli-token.json"
